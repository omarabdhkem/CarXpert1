version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: carxpert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carxpert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carxpert123}
      POSTGRES_DB: ${POSTGRES_DB:-carxpert}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carxpert} -d ${POSTGRES_DB:-carxpert}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carxpert-network

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: carxpert-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-carxpert}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-carxpert123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-carxpert_analytics}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carxpert-network

  # CarXpert Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carxpert-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carxpert}:${POSTGRES_PASSWORD:-carxpert123}@postgres:5432/${POSTGRES_DB:-carxpert}
      - MONGODB_URI=mongodb://${MONGO_USER:-carxpert}:${MONGO_PASSWORD:-carxpert123}@mongodb:27017/${MONGO_DB:-carxpert_analytics}?authSource=admin
      - SESSION_SECRET=${SESSION_SECRET:-your-super-secret-session-key-change-me}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - carxpert-network

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: carxpert-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - carxpert-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  carxpert-network:
    driver: bridge
