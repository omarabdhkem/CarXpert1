version: '3.8'

# Development Docker Compose Configuration
# Use: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: carxpert-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: carxpert
      POSTGRES_PASSWORD: carxpert123
      POSTGRES_DB: carxpert
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carxpert -d carxpert"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carxpert-dev-network

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: carxpert-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: carxpert
      MONGO_INITDB_ROOT_PASSWORD: carxpert123
      MONGO_INITDB_DATABASE: carxpert_analytics
    volumes:
      - mongodb_dev_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carxpert-dev-network

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: carxpert-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@carxpert.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - carxpert-dev-network
    profiles:
      - tools

  # Mongo Express (Optional - for MongoDB management)
  mongo-express:
    image: mongo-express:latest
    container_name: carxpert-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: carxpert
      ME_CONFIG_MONGODB_ADMINPASSWORD: carxpert123
      ME_CONFIG_MONGODB_URL: mongodb://carxpert:carxpert123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - carxpert-dev-network
    profiles:
      - tools

volumes:
  postgres_dev_data:
    driver: local
  mongodb_dev_data:
    driver: local

networks:
  carxpert-dev-network:
    driver: bridge
